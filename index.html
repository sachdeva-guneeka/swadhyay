<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one narrow column app, top status strip, tab bar, OMR-sheet style answer bubbles */
:root{
  --bg:#f4faf8; --surface:#ffffff; --fg:#0a001a; --muted:#5b6470; --line:#d8e6e4;
  --accent:#00798f; --accent-fg:#ffffff; --hi:#7ed957; --hi-fg:#0a001a;
  --good:#1a7f4b; --good-bg:#dff3e7; --bad:#b3372b; --bad-bg:#fbe3df; --warn:#8a5a00; --warn-bg:#fff0cc;
  --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --body:'Figtree','Segoe UI',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1114; --surface:#141f24; --fg:#eaf3f4; --muted:#9fb0b5; --line:#2a3d43;
  --accent:#5fd0e0; --accent-fg:#04181c; --hi:#7ed957; --hi-fg:#0a001a;
  --good:#6fd39b; --good-bg:#17382a; --bad:#ff9a8d; --bad-bg:#3d1f1b; --warn:#ffd277; --warn-bg:#3a2f12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1114; --surface:#141f24; --fg:#eaf3f4; --muted:#9fb0b5; --line:#2a3d43;
  --accent:#5fd0e0; --accent-fg:#04181c; --hi:#7ed957; --hi-fg:#0a001a;
  --good:#6fd39b; --good-bg:#17382a; --bad:#ff9a8d; --bad-bg:#3d1f1b; --warn:#ffd277; --warn-bg:#3a2f12; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:400 15px/1.5 var(--body);padding-block:12px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.15}
h2{font-size:22px;font-weight:800} h3{font-size:17px;font-weight:600}
p{margin:0}
.muted{color:var(--muted)} .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font:800 24px var(--display);letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.brand small{font:500 14px var(--body);color:var(--muted);letter-spacing:0}
.stats{display:flex;gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 12px;display:flex;flex-direction:column;min-width:78px}
.stat b{font:500 18px var(--mono)} .stat small{color:var(--muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
nav{display:flex;gap:4px;border-bottom:2px solid var(--line);overflow-x:auto}
nav button{background:none;border:0;color:var(--muted);font:600 14px var(--body);padding:10px 12px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
nav button[aria-selected="true"]{color:var(--fg);border-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:500 12px var(--mono);border:1px solid var(--line);border-radius:6px;padding:2px 8px;color:var(--muted)}
.pill{font:600 12px var(--body);border-radius:99px;padding:3px 10px}
.pill.good{background:var(--good-bg);color:var(--good)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)}
.btn{font:600 14px var(--body);border-radius:8px;padding:9px 14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{font:600 13px var(--body);border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:99px;padding:5px 12px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font:500 15px var(--body);color:var(--fg);cursor:pointer}
.bub{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;font:500 13px var(--mono);color:var(--muted)}
.opt.sel .bub{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.opt.right{border-color:var(--good);background:var(--good-bg)} .opt.right .bub{background:var(--good);border-color:var(--good);color:var(--bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)} .opt.wrong .bub{background:var(--bad);border-color:var(--bad);color:var(--bg)}
.expl{background:var(--bg);border-left:4px solid var(--accent);border-radius:6px;padding:10px 12px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.hi{background:var(--hi);color:var(--hi-fg);border-radius:6px;padding:1px 8px;font:500 14px var(--mono)}
label{font:600 13px var(--body);display:flex;flex-direction:column;gap:4px}
input,select,textarea{font:400 15px var(--body);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
fieldset{border:1px solid var(--line);border-radius:10px;padding:12px;margin:0;display:flex;flex-direction:column;gap:10px;min-width:0}
legend{font:600 13px var(--mono);padding:0 6px;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px} @media(max-width:480px){.two{grid-template-columns:1fr}}
.err{color:var(--bad);font-weight:600}
table{width:100%;border-collapse:collapse} td,th{padding:9px 6px;text-align:left;border-bottom:1px solid var(--line)} th{font:600 12px var(--body);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
tr.me td{background:var(--warn-bg);font-weight:600}
.tablewrap{overflow-x:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:20;max-width:90vw}
.note{font-size:13px;color:var(--muted)}
@media(prefers-reduced-motion:no-preference){.bar i{transition:width .4s}}
</style>

function practice(){
  var tracks=["All","CBSE","JEE","NEET","CUET"];
  var list=S.quizzes.filter(function(q){return S.filter==="All"||q.track===S.filter});
  return '<div class="filters" role="group" aria-label="Exam track">'+tracks.map(function(t){return '<button data-act="filter" data-v="'+t+'" aria-pressed="'+(S.filter===t)+'">'+t+'</button>'}).join("")+'</div>'+
  '<div class="card"><p><b>How points work.</b> Playing earns up to <span class="hi">10</span> points based on your marks. Creating a verified quiz that 5 other students play earns <span class="hi">20</span>.</p></div>'+
  (list.length?'<div class="grid">'+list.map(function(q){
    return '<div class="card"><div class="chips"><span class="chip">Class '+q.cls+'</span><span class="chip">'+esc(q.track)+'</span><span class="chip">'+q.qs.length+' Qs</span></div>'+
    '<h3>'+esc(q.title)+'</h3><p class="note">'+esc(q.chapter)+' · by '+esc(q.by)+'</p>'+
    '<div class="row spread">'+(q.done!==null?'<span class="pill good">Scored '+q.done+'/'+q.qs.length+'</span>':'<span class="note">Not attempted</span>')+
    '<button class="btn primary" data-act="start" data-v="'+q.id+'">'+(q.done!==null?'Play again':'Start')+'</button></div></div>'}).join("")+'</div>'
   :'<div class="card"><p>No quizzes for '+S.filter+' yet. Create the first one in the Create tab.</p></div>');
}
function playView(){
  var p=S.play,q=p.quiz,i=p.i;
  if(i>=q.qs.length){
    var pts=Math.round(10*p.score/q.qs.length);
    return '<div class="card"><h2>Quiz complete</h2><p>You scored <b class="mono">'+p.score+'/'+q.qs.length+'</b> and earned <span class="hi">+'+pts+' points</span>.</p>'+
      (p.streakUp?'<p>Streak extended to <b>'+S.streak+' days</b>.</p>':'')+
      '<div class="row"><button class="btn primary" data-act="tab" data-v="practice">Back to quizzes</button><button class="btn" data-act="tab" data-v="create">Create your own for 20 points</button></div></div>';
  }
  var cur=q.qs[i];
  return '<div class="card"><div class="row spread"><span class="chip">Question '+(i+1)+' of '+q.qs.length+'</span><button class="btn" data-act="tab" data-v="practice">Exit</button></div>'+
   '<div class="bar"><i style="width:'+(i/q.qs.length*100)+'%"></i></div><h3>'+esc(cur.q)+'</h3>'+
   cur.o.map(function(o,k){
     var c="opt";if(p.picked!==null){if(k===cur.a)c+=" right";else if(k===p.picked)c+=" wrong"}
     return '<button class="'+c+'" data-act="pick" data-v="'+k+'"'+(p.picked!==null?' disabled':'')+'><span class="bub">'+L[k]+'</span><span>'+esc(o)+'</span></button>'}).join("")+
   (p.picked!==null?'<div class="expl"><b>'+(p.picked===cur.a?"Correct.":"Not quite.")+'</b> '+esc(cur.e)+'</div><button class="btn primary" data-act="next">'+(i+1<q.qs.length?"Next question":"See result")+'</button>':'')+'</div>';
}
function createView(){
  var d=[["Which law relates voltage, current and resistance?",["Ohm's law","Faraday's law","Lenz's law","Gauss's law"],0,"V = IR, so current in a resistor is proportional to the voltage across it."],
         ["The SI unit of resistance is",["Ampere","Ohm","Volt","Watt"],1,"Resistance is measured in ohms (Ω)."],
         ["If voltage is 10 V and resistance is 5 Ω, the current is",["0.5 A","2 A","5 A","50 A"],1,"I = V/R = 10/5 = 2 A."]];
  var h='<div class="card"><h2>Create a quiz</h2><p class="note">Every question needs an explanation, because writing it is the learning. Your 20 points unlock after the AI check passes and 5 other students play. An example is filled in so you can try the flow.</p>'+
   '<form id="cf" class="card" style="padding:0;border:0">'+
   '<label>Quiz title<input id="f-title" value="Current Electricity: Ohm\'s Law"></label>'+
   '<div class="two"><label>Class<select id="f-cls">'+[9,10,11,12].map(function(c){return '<option'+(c===12?' selected':'')+'>'+c+'</option>'}).join("")+'</select></label>'+
   '<label>Exam track<select id="f-track">'+["CBSE","JEE","NEET","CUET"].map(function(t){return '<option>'+t+'</option>'}).join("")+'</select></label></div>'+
   '<label>Chapter<input id="f-chap" value="Current Electricity"></label>';
  d.forEach(function(x,n){
    h+='<fieldset><legend>Question '+(n+1)+'</legend><label>Question<input id="q'+n+'" value="'+esc(x[0])+'"></label><div class="two">'+
    x[1].map(function(o,k){return '<label>Option '+L[k]+'<input id="q'+n+'o'+k+'" value="'+esc(o)+'"></label>'}).join("")+'</div>'+
    '<label>Correct answer<select id="q'+n+'a">'+L.split("").map(function(c,k){return '<option value="'+k+'"'+(k===x[2]?' selected':'')+'>'+c+'</option>'}).join("")+'</select></label>'+
    '<label>Explanation<textarea id="q'+n+'e" rows="2">'+esc(x[3])+'</textarea></label></fieldset>';
  });
  h+='<label style="flex-direction:row;align-items:center;gap:8px;font-weight:500"><input type="checkbox" id="f-sim" style="width:auto"'+(S.simFail?' checked':'')+'> Demo only: make the AI disagree with question 2</label>'+
   (S.errs.length?'<p class="err" role="alert">'+S.errs.join(" ")+'</p>':'')+
   '<div class="row"><button type="submit" class="btn primary">Run AI check and publish</button></div></form></div>';
  return h;
}
function mineView(){
  if(!S.mine.length)return '<div class="card"><h3>No quizzes yet</h3><p class="note">Quizzes you create appear here with their AI check result and how many students have played them.</p><div><button class="btn primary" data-act="tab" data-v="create">Create a quiz</button></div></div>';
  return S.mine.map(function(m,ix){
    var st=m.status==="verified"?'<span class="pill good">AI check passed</span>':'<span class="pill warn">Needs review</span>';
    var paid=m.paid?'<span class="pill good">+20 points earned</span>':'';
    var body='<ul style="margin:0;padding-left:18px">'+m.check.map(function(c){return '<li>Q'+(c.n+1)+': '+(c.ok?'AI answer matches your key ('+L[c.ai]+').':'<b>AI picked '+L[c.ai]+', your key says '+L[c.key]+'.</b> Recheck this question.')+'</li>'}).join("")+'</ul>';
    var prog=m.status==="verified"?'<div><div class="row spread"><span class="note">Unique players (not counting you)</span><b class="mono">'+Math.min(m.players,5)+'/5</b></div><div class="bar"><i style="width:'+Math.min(m.players,5)/5*100+'%"></i></div></div>':
      '<p class="note">Hidden from other students until the check passes.</p>';
    var act=m.status==="verified"?'<button class="btn" data-act="sim" data-v="'+ix+'"'+(m.players>=5?' disabled':'')+'>Simulate a classmate playing</button>':
      '<button class="btn primary" data-act="fix" data-v="'+ix+'">I fixed the answer key, re-run check</button>';
    return '<div class="card"><div class="chips"><span class="chip">Class '+m.cls+'</span><span class="chip">'+esc(m.track)+'</span></div><h3>'+esc(m.title)+'</h3><div class="row">'+st+paid+'</div>'+body+prog+'<div class="row">'+act+'</div></div>';
  }).join("");
}
function boardView(){
  var rows=S.board.concat([["You",S.points]]).sort(function(a,b){return b[1]-a[1]});
  return '<div class="card"><h2>Weekly leaderboard</h2><p class="note">Other names are sample data for this prototype. Resets every Monday so new students can win.</p><div class="tablewrap"><table><thead><tr><th>#</th><th>Student</th><th>Points</th></tr></thead><tbody>'+
   rows.map(function(r,i){return '<tr'+(r[0]==="You"?' class="me"':'')+'><td class="mono">'+(i+1)+'</td><td>'+esc(r[0])+'</td><td class="mono">'+r[1]+'</td></tr>'}).join("")+'</tbody></table></div></div>';
}
function render(){
  var v=S.tab==="practice"?practice():S.tab==="play"?playView():S.tab==="create"?createView():S.tab==="mine"?mineView():boardView();
  $("root").innerHTML=head()+v;
  var f=$("cf");if(f)f.addEventListener("submit",publish);
}
function aiCheck(qs,sim){
  return qs.map(function(q,n){var ai=q.a;if(sim&&n===1)ai=(q.a+1)%4;return {n:n,key:q.a,ai:ai,ok:ai===q.a}});
}
function publish(e){
  e.preventDefault();S.errs=[];
  var v=function(id){return $(id).value.trim()},qs=[];
  if(!v("f-title"))S.errs.push("Add a quiz title.");
  for(var n=0;n<3;n++){
    var o=[0,1,2,3].map(function(k){return v("q"+n+"o"+k)});
    if(!v("q"+n)||o.some(function(x){return !x}))S.errs.push("Fill the question and all four options for question "+(n+1)+".");
    if(!v("q"+n+"e"))S.errs.push("Add an explanation for question "+(n+1)+".");
    qs.push({q:v("q"+n),o:o,a:+$("q"+n+"a").value,e:v("q"+n+"e")});
  }
  S.simFail=$("f-sim").checked;
  if(S.errs.length){render();return}
  var chk=aiCheck(qs,S.simFail),bad=chk.some(function(c){return !c.ok});
  S.mine.unshift({title:v("f-title"),cls:+$("f-cls").value,track:$("f-track").value,chapter:v("f-chap"),qs:qs,check:chk,status:bad?"review":"verified",players:0,paid:false});
  S.tab="mine";render();
  toast(bad?"AI disagreed on a question. Review it before publishing.":"AI check passed. Your quiz is live.");
}
function finishQuiz(){
  var p=S.play,pts=Math.round(10*p.score/p.quiz.qs.length);
  S.points+=pts;p.quiz.done=Math.max(p.quiz.done||0,p.score);
  if(!S.playedToday){S.playedToday=true;S.streak+=1;p.streakUp=true}
}
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-act]");if(!b)return;
  var a=b.dataset.act,v=b.dataset.v;
  if(a==="tab"){S.tab=v;S.errs=[];render()}
  else if(a==="filter"){S.filter=v;render()}
  else if(a==="start"){var q=S.quizzes.filter(function(x){return x.id==+v})[0];S.play={quiz:q,i:0,score:0,picked:null,streakUp:false};S.tab="play";render()}
  else if(a==="pick"){var p=S.play;p.picked=+v;if(p.picked===p.quiz.qs[p.i].a)p.score++;render()}
  else if(a==="next"){var p2=S.play;p2.i++;p2.picked=null;if(p2.i>=p2.quiz.qs.length)finishQuiz();render()}
  else if(a==="sim"){var m=S.mine[+v];m.players++;
    if(m.players>=5&&!m.paid){m.paid=true;S.points+=20;toast("5 unique players reached. You earned 20 points.")}
    else toast("A classmate completed your quiz.");
    render()}
  else if(a==="fix"){var m2=S.mine[+v];m2.check=aiCheck(m2.qs,false);m2.status="verified";S.simFail=false;render();toast("AI check passed. Your quiz is live.")}
});
render();
</script>
